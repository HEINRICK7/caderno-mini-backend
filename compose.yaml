services:
  api:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_FILE: /app/data/caderno-mini.sqlite
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - caderno-mini-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  caderno-mini-data:
