name: CI and delivery

on:
  push:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: caderno-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag caderno-mini-backend:ci .

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check all dependency vulnerabilities
        run: npm audit --audit-level=moderate

  deploy-development:
    name: deploy development
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEVELOPMENT_DEPLOY_ENABLED == 'true' }}
    needs: quality
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-hostinger.yml
    with:
      deploy_environment: development

  deploy-staging:
    name: deploy staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.STAGING_DEPLOY_ENABLED == 'true' }}
    needs: quality
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-hostinger.yml
    with:
      deploy_environment: staging

  deploy-production:
    name: deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs: quality
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-hostinger.yml
    with:
      deploy_environment: production
