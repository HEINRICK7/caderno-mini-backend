name: CI and delivery

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: caderno-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag caderno-mini-backend:ci .

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check all dependency vulnerabilities
        run: npm audit --audit-level=moderate

  deploy:
    name: deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      deployments: write
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      HOSTINGER_APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare SSH access
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_HOST:?Set HOSTINGER_HOST in the production environment}"
          : "${HOSTINGER_USER:?Set HOSTINGER_USER in the production environment}"
          : "${HOSTINGER_APP_PATH:?Set HOSTINGER_APP_PATH in the production environment}"
          : "${HOSTINGER_SSH_PRIVATE_KEY:?Set HOSTINGER_SSH_PRIVATE_KEY in the production environment}"
          : "${HOSTINGER_KNOWN_HOSTS:?Set HOSTINGER_KNOWN_HOSTS in the production environment}"
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            /*) ;;
            *) echo "HOSTINGER_APP_PATH must be an absolute path" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            *[!A-Za-z0-9_./-]*) echo "HOSTINGER_APP_PATH may contain only letters, numbers, slash, dot, underscore, and hyphen" >&2; exit 1 ;;
          esac
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Create application directory
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$HOSTINGER_APP_PATH'"

      - name: Copy release to the VPS
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes -p $HOSTINGER_SSH_PORT" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='data/' \
            --exclude='backups/' \
            --exclude='.env' \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_APP_PATH/"

      - name: Build and restart the service
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd '$HOSTINGER_APP_PATH' && docker compose up -d --build"
