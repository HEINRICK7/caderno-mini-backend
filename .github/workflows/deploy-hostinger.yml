name: Deploy to Hostinger

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: GitHub environment providing the isolated Hostinger configuration
        type: string
        required: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: deploy ${{ inputs.deploy_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.deploy_environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      HOSTINGER_APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
      HOSTINGER_API_PORT: ${{ vars.HOSTINGER_API_PORT }}
      HOSTINGER_DEPLOY_NETWORK: caderno-mini-production
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare SSH access
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_HOST:?Set HOSTINGER_HOST in the selected GitHub environment}"
          : "${HOSTINGER_USER:?Set HOSTINGER_USER in the selected GitHub environment}"
          : "${HOSTINGER_APP_PATH:?Set HOSTINGER_APP_PATH in the selected GitHub environment}"
          : "${HOSTINGER_API_PORT:?Set HOSTINGER_API_PORT to a free, loopback-only port in the selected GitHub environment}"
          : "${HOSTINGER_SSH_PRIVATE_KEY:?Set HOSTINGER_SSH_PRIVATE_KEY in the selected GitHub environment}"
          : "${HOSTINGER_KNOWN_HOSTS:?Set HOSTINGER_KNOWN_HOSTS in the selected GitHub environment}"
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            /*) ;;
            *) echo "HOSTINGER_APP_PATH must be an absolute path" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            *[!A-Za-z0-9_./-]*) echo "HOSTINGER_APP_PATH may contain only letters, numbers, slash, dot, underscore, and hyphen" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            */caderno-mini/backend) ;;
            *) echo "HOSTINGER_APP_PATH must be a dedicated directory ending in /caderno-mini/backend" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_API_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_API_PORT must be numeric" >&2; exit 1 ;;
          esac
          if [ "$HOSTINGER_API_PORT" -lt 1024 ] || [ "$HOSTINGER_API_PORT" -gt 65535 ]; then
            echo "HOSTINGER_API_PORT must be between 1024 and 65535" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify isolated application directory and port
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "set -eu
            app_path='$HOSTINGER_APP_PATH'
            marker=\"\$app_path/.caderno-mini-backend-deploy\"
            project='caderno-mini-production-backend'
            api_port='$HOSTINGER_API_PORT'
            network='$HOSTINGER_DEPLOY_NETWORK'
            mkdir -p \"\$(dirname \"\$app_path\")\"
            if [ -e \"\$app_path\" ]; then
              if [ -L \"\$app_path\" ]; then
                echo 'Refusing to deploy through a symlinked application directory.' >&2
                exit 1
              fi
              if [ ! -f \"\$marker\" ]; then
                if [ -n \"\$(find \"\$app_path\" -mindepth 1 -maxdepth 1 ! -name .env ! -name .caderno-mini-backend-deploy -print -quit 2>/dev/null)\" ]; then
                  echo 'Refusing to deploy: the target directory already contains files and has no Cadernô ownership marker.' >&2
                  exit 1
                fi
              fi
            else
              mkdir -p \"\$app_path\"
            fi
            touch \"\$marker\"
            if [ ! -f \"\$app_path/.env\" ]; then
              echo 'Refusing to deploy: configure the production .env in the dedicated application directory first.' >&2
              exit 1
            fi
            if docker network inspect \"\$network\" >/dev/null 2>&1; then
              owner=\$(docker network inspect --format '{{ index .Labels \"com.caderno-mini.environment\" }}' \"\$network\")
              if [ \"\$owner\" != 'production' ]; then
                echo 'Refusing to use a Docker network not marked for the Cadernô production deployment.' >&2
                exit 1
              fi
            else
              docker network create --label com.caderno-mini.environment=production \"\$network\" >/dev/null
            fi
            for id in \$(docker ps -aq --filter label=com.docker.compose.project=\$project); do
              working_dir=\$(docker inspect --format '{{ index .Config.Labels \"com.docker.compose.project.working_dir\" }}' \"\$id\")
              if [ \"\$working_dir\" != \"\$app_path\" ]; then
                echo 'Refusing to update a Compose project owned by another directory.' >&2
                exit 1
              fi
            done
            if ss -lntH \"( sport = :\$api_port )\" | grep -q .; then
              owner=\$(docker ps -q --filter label=com.docker.compose.project=\$project --filter publish=\$api_port)
              if [ -z \"\$owner\" ]; then
                echo 'Refusing to deploy: HOSTINGER_API_PORT is already used by another VPS service.' >&2
                exit 1
              fi
            fi"

      - name: Configure creator allowlist
        shell: bash
        env:
          SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
        run: |
          set -euo pipefail
          : "${SUPERADMIN_EMAILS:?Set SUPERADMIN_EMAILS as a GitHub environment secret before deploying}"
          if [[ ! "$SUPERADMIN_EMAILS" =~ ^[A-Za-z0-9._+@,-]+$ ]]; then
            echo 'SUPERADMIN_EMAILS must be a comma-separated list of email addresses without spaces.' >&2
            exit 1
          fi
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          remote="umask 077
          app_path='$HOSTINGER_APP_PATH'
          config_file=\$app_path/.env.admin
          if [ -L \"\$config_file\" ]; then
            echo 'Refusing to write creator configuration through a symlink.' >&2
            exit 1
          fi
          temp_file=\$(mktemp \"\$app_path/.env.admin.XXXXXX\")
          cat > \"\$temp_file\"
          chmod 600 \"\$temp_file\"
          mv \"\$temp_file\" \"\$config_file\""
          printf 'SUPERADMIN_EMAILS=%s\n' "$SUPERADMIN_EMAILS" | ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" "$remote"

      - name: Configure Cakto environment file
        shell: bash
        env:
          CAKTO_CHECKOUT_URL: ${{ vars.CAKTO_CHECKOUT_URL }}
          CAKTO_PRODUCT_ID: ${{ vars.CAKTO_PRODUCT_ID }}
          CAKTO_WEBHOOK_SECRET: ${{ secrets.CAKTO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac

          configured_count=0
          [ -z "$CAKTO_CHECKOUT_URL" ] || configured_count=$((configured_count + 1))
          [ -z "$CAKTO_PRODUCT_ID" ] || configured_count=$((configured_count + 1))
          [ -z "$CAKTO_WEBHOOK_SECRET" ] || configured_count=$((configured_count + 1))
          if [ "$configured_count" -ne 0 ] && [ "$configured_count" -ne 3 ]; then
            echo 'Set CAKTO_CHECKOUT_URL, CAKTO_PRODUCT_ID, and CAKTO_WEBHOOK_SECRET together in the production environment.' >&2
            exit 1
          fi

          remote="umask 077
          app_path='$HOSTINGER_APP_PATH'
          config_file=\$app_path/.env.cakto
          if [ -L \"\$config_file\" ]; then
            echo 'Refusing to write Cakto configuration through a symlink.' >&2
            exit 1
          fi
          if [ '$configured_count' -eq 3 ]; then
            temp_file=\$(mktemp \"\$app_path/.env.cakto.XXXXXX\")
            cat > \"\$temp_file\"
            chmod 600 \"\$temp_file\"
            mv \"\$temp_file\" \"\$config_file\"
          elif [ ! -e \"\$config_file\" ]; then
            install -m 600 /dev/null \"\$config_file\"
          fi"

          if [ "$configured_count" -eq 3 ]; then
            {
              printf 'CAKTO_CHECKOUT_URL=%s\n' "$CAKTO_CHECKOUT_URL"
              printf 'CAKTO_PRODUCT_ID=%s\n' "$CAKTO_PRODUCT_ID"
              printf 'CAKTO_WEBHOOK_SECRET=%s\n' "$CAKTO_WEBHOOK_SECRET"
            } | ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
              "$HOSTINGER_USER@$HOSTINGER_HOST" "$remote"
          else
            ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
              "$HOSTINGER_USER@$HOSTINGER_HOST" "$remote"
          fi

      - name: Copy release to the VPS
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          rsync -az -e "ssh -o StrictHostKeyChecking=yes -p $HOSTINGER_SSH_PORT" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='data/' \
            --exclude='backups/' \
            --exclude='.env' \
            --exclude='.env.admin' \
            --exclude='.env.cakto' \
            --exclude='.caderno-mini-backend-deploy' \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_APP_PATH/"

      - name: Build and restart the service
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "set -eu
            cd '$HOSTINGER_APP_PATH'
            API_PORT='$HOSTINGER_API_PORT' docker compose -f compose.yaml -f compose.production.yaml --project-name caderno-mini-production-backend up -d --build
            for attempt in \$(seq 1 30); do
              container=\$(docker compose -f compose.yaml -f compose.production.yaml --project-name caderno-mini-production-backend ps -q api)
              health=\$(docker inspect --format '{{.State.Health.Status}}' \"\$container\" 2>/dev/null || true)
              if [ \"\$health\" = healthy ]; then break; fi
              if [ \"\$attempt\" = 30 ]; then
                docker compose -f compose.yaml -f compose.production.yaml --project-name caderno-mini-production-backend ps
                echo 'Backend health check failed.' >&2
                exit 1
              fi
              sleep 2
            done
            docker compose -f compose.yaml -f compose.production.yaml --project-name caderno-mini-production-backend exec -T api npm run db:seed:catalog:prod"
